<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Page - E-Gov</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="mb-4">API Testing Page</h1>
        <p class="text-muted">Use this page to test if your PHP APIs are working correctly</p>

        <!-- Test Notices API -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Notices API</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testNoticesAPI()">Test Notices API</button>
                <div id="noticesResult" class="mt-3"></div>
            </div>
        </div>

        <!-- Test Applications API -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Applications API</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testApplicationsAPI()">Test Applications API</button>
                <div id="applicationsResult" class="mt-3"></div>
            </div>
        </div>

        <!-- Test Exams API -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Exam Schedules API</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testExamsAPI()">Test Exams API</button>
                <div id="examsResult" class="mt-3"></div>
            </div>
        </div>

        <!-- Test Contact API -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Contact Form API</h5>
            </div>
            <div class="card-body">
                <form id="contactTestForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" name="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="email" class="form-control" name="email" placeholder="Email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" name="phone" placeholder="Phone">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" name="subject" placeholder="Subject" required>
                        </div>
                        <div class="col-12 mb-3">
                            <textarea class="form-control" name="message" rows="3" placeholder="Message" required></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Submit Test Message</button>
                        </div>
                    </div>
                </form>
                <div id="contactResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        async function testNoticesAPI() {
            const resultDiv = document.getElementById('noticesResult');
            resultDiv.innerHTML = '<div class="spinner-border text-primary"></div> Loading...';
            
            try {
                const response = await fetch('../api/notices.php?limit=5');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">✓ API Working! Found ${data.data.length} notices</div>
                        <pre class="bg-light p-3 rounded">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        async function testApplicationsAPI() {
            const resultDiv = document.getElementById('applicationsResult');
            resultDiv.innerHTML = '<div class="spinner-border text-primary"></div> Loading...';
            
            try {
                const response = await fetch('../api/applications.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">✓ API Working! Found ${data.data.length} applications</div>
                        <pre class="bg-light p-3 rounded">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        async function testExamsAPI() {
            const resultDiv = document.getElementById('examsResult');
            resultDiv.innerHTML = '<div class="spinner-border text-primary"></div> Loading...';
            
            try {
                const response = await fetch('../api/exams.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">✓ API Working! Found ${data.data.length} exam schedules</div>
                        <pre class="bg-light p-3 rounded">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        document.getElementById('contactTestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('contactResult');
            resultDiv.innerHTML = '<div class="spinner-border text-primary"></div> Submitting...';
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('../api/contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `<div class="alert alert-success">✓ ${result.message}</div>`;
                    e.target.reset();
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
